<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Painel da Loja</title>
  <meta http-equiv="refresh" content="0; url=https://accounts.google.com/AccountChooser?continue=https%3A%2F%2Fscript.google.com%2Fmacros%2Fs%2FAKfycbzFF-Sll4ttveguSIQfCDc1WDjy-4FwINTcuD3IKDpBfFFTWAWm0DL4SMo-glQm4IO_4Q%2Fexec">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FBF7F2;
      --wine: #7A2E3D;
      --muted: #8A7C74;
      --border: #EAE0D5;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    .caixa {
      text-align: center; padding: 30px; display: flex; flex-direction: column;
      align-items: center; gap: 16px; max-width: 320px;
    }
    .titulo { font-family: 'Fraunces', serif; font-size: 20px; color: #2B1B1F; }
    .titulo span { color: var(--wine); }
    .spinner {
      width: 26px; height: 26px; border-radius: 50%;
      border: 3px solid var(--border); border-top-color: var(--wine);
      animation: girar 0.8s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }
    p { color: var(--muted); font-size: 13.5px; line-height: 1.5; margin: 0; }
    a.botao {
      background: var(--wine); color: #fff; text-decoration: none;
      padding: 12px 22px; border-radius: 10px; font-weight: 600; font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="caixa">
    <div class="titulo">🛍️ Painel <span>da Loja</span></div>
    <div class="spinner"></div>
    <p>Abrindo o painel...</p>
    <a class="botao" id="linkManual" href="https://accounts.google.com/AccountChooser?continue=https%3A%2F%2Fscript.google.com%2Fmacros%2Fs%2FAKfycbzFF-Sll4ttveguSIQfCDc1WDjy-4FwINTcuD3IKDpBfFFTWAWm0DL4SMo-glQm4IO_4Q%2Fexec">
      Se não abrir sozinho, toque aqui
    </a>
  </div>

  <script>
    // Redirecionamento passando pelo seletor de contas do Google — assim, mesmo
    // com mais de uma conta logada no navegador, ele sempre pergunta qual usar
    // em vez de escolher a errada silenciosamente.
    window.location.replace("https://accounts.google.com/AccountChooser?continue=https%3A%2F%2Fscript.google.com%2Fmacros%2Fs%2FAKfycbzFF-Sll4ttveguSIQfCDc1WDjy-4FwINTcuD3IKDpBfFFTWAWm0DL4SMo-glQm4IO_4Q%2Fexec");
  </script>
</body>
</html>
