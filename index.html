<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Painel da Loja</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FBF7F2;
      --wine: #7A2E3D;
      --muted: #8A7C74;
      --border: #EAE0D5;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg);
      font-family: 'Inter', sans-serif;
    }
    #carregando {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
      background: var(--bg); transition: opacity .25s ease;
    }
    #carregando .titulo {
      font-family: 'Fraunces', serif; font-size: 20px; color: #2B1B1F;
    }
    #carregando .titulo span { color: var(--wine); }
    .spinner {
      width: 26px; height: 26px; border-radius: 50%;
      border: 3px solid var(--border); border-top-color: var(--wine);
      animation: girar 0.8s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }

    #erro {
      display: none; position: fixed; inset: 0; background: var(--bg);
      flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 30px; gap: 14px;
    }
    #erro p { color: var(--muted); font-size: 14px; max-width: 320px; line-height: 1.5; }
    #erro a {
      background: var(--wine); color: #fff; text-decoration: none;
      padding: 12px 22px; border-radius: 10px; font-weight: 600; font-size: 14px;
    }

    iframe {
      position: fixed; inset: 0; width: 100%; height: 100%;
      border: none; opacity: 0; transition: opacity .3s ease;
    }
    iframe.pronto { opacity: 1; }
  </style>
</head>
<body>

  <div id="carregando">
    <div class="titulo">🛍️ Painel <span>da Loja</span></div>
    <div class="spinner"></div>
  </div>

  <div id="erro">
    <div class="titulo" style="font-size:18px">Não deu pra carregar o painel</div>
    <p>Isso pode acontecer se a implantação do Google Apps Script foi alterada.
       Tenta abrir direto pelo link abaixo.</p>
    <a id="linkDireto" href="#" target="_blank" rel="noopener">Abrir em nova aba</a>
  </div>

  <iframe id="painel"
          src="https://script.google.com/macros/s/AKfycbzFF-Sll4ttveguSIQfCDc1WDjy-4FwINTcuD3IKDpBfFFTWAWm0DL4SMo-glQm4IO_4Q/exec"
          title="Painel de Vendas"
          allow="clipboard-write">
  </iframe>

  <script>
    const URL_PAINEL = document.getElementById('painel').src;
    document.getElementById('linkDireto').href = URL_PAINEL;

    const iframe = document.getElementById('painel');
    const carregando = document.getElementById('carregando');
    const erro = document.getElementById('erro');
    let carregou = false;

    iframe.addEventListener('load', function () {
      carregou = true;
      iframe.classList.add('pronto');
      carregando.style.display = 'none';
    });

    // Se em 6s nada carregou, mostra a opção de abrir direto
    setTimeout(function () {
      if (!carregou) {
        carregando.style.display = 'none';
        erro.style.display = 'flex';
      }
    }, 6000);
  </script>
</body>
</html>
